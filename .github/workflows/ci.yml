name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Spec output in the log, and one annotation per failing test.
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/gh-reporter.mjs --test-reporter-destination=stdout
        env:
          HARNESS_TEST_INSTALL: '1'
